<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../css/page.css">
    <link rel="stylesheet" href="../css/themes.css">
</head>
<body class="page-body" data-tema="plava">
    <div class="page-wrap auth-wrap">
        <h1>Prijava</h1>
        <p class="intro">Unesi email i lozinku. Nakon uspjesne prijave otvara se Angular aplikacija u novom tabu.</p>

        <form id="loginForm" class="auth-form">
            <label for="loginEmail">Email</label>
            <input type="email" id="loginEmail" required>

            <label for="loginPass">Password</label>
            <input type="password" id="loginPass" required>

            <button type="submit">Prijavi se</button>
        </form>

        <p class="auth-link">Nemas nalog? <a href="#" id="goRegister">Registruj se</a></p>
        <p id="loginPoruka" class="auth-poruka"></p>
    </div>

    <script src="../js/theme.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
