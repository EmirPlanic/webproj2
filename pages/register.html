<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="../css/page.css">
    <link rel="stylesheet" href="../css/themes.css">
</head>
<body class="page-body" data-tema="plava">
    <div class="page-wrap auth-wrap">
        <h1>Registracija</h1>
        <p class="intro">Popuni podatke i izaberi temu. Tema se primjenjuje na IPI stranicu i kasnije u Angular aplikaciji.</p>

        <form id="registerForm" class="auth-form">
            <label for="regIme">Ime</label>
            <input type="text" id="regIme" required>

            <label for="regEmail">Email</label>
            <input type="email" id="regEmail" required>

            <label for="regPass">Password</label>
            <input type="password" id="regPass" required minlength="4">

            <label for="regTema">Tema</label>
            <select id="regTema" required>
                <option value="plava">Plava</option>
                <option value="zelena">Zelena</option>
                <option value="roza">Roza</option>
                <option value="narandzasta">Narandzasta</option>
                <option value="dark">Tamna (dark)</option>
                <option value="cyberpunk">Cyberpunk</option>
            </select>

            <button type="submit">Registruj se</button>
        </form>

        <p class="auth-link">Vec imas nalog? <a href="#" id="goLogin">Prijavi se</a></p>
        <p id="regPoruka" class="auth-poruka"></p>
    </div>

    <script src="../js/theme.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
