<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt</title>
    <link rel="stylesheet" href="../css/page.css">
</head>
<body class="page-body">
    <div class="page-wrap">
        <h1>Kontakt</h1>
        <p class="intro">
            Imate pitanje ili prijedlog? Popunite formu ispod i posaljite nam poruku
            putem vaseg email klijenta.
        </p>

        <form id="contactForm" class="contact-form">
            <label for="ime">Ime i prezime</label>
            <input type="text" id="ime" name="ime" required>

            <label for="email">Vasa email adresa</label>
            <input type="email" id="email" name="email" required>

            <label for="predmet">Predmet</label>
            <input type="text" id="predmet" name="predmet" required>

            <label for="poruka">Poruka</label>
            <textarea id="poruka" name="poruka" rows="6" required></textarea>

            <button type="submit">Posalji poruku</button>
        </form>
    </div>

    <script src="../js/kontakt.js"></script>
</body>
</html>
