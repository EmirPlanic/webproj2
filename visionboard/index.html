<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Vision Board</h1>

    <div class="toolbar">
        <button id="addNoteBtn" type="button">Post It</button>
        <button id="addImageBtn" type="button">Slika</button>
        <button id="addQuoteBtn" type="button">Citat</button>
        <button id="saveBtn" type="button">Spremi</button>
        <button id="clearBtn" type="button">Ocisti plocu</button>
        <button id="pdfBtn" type="button">Snimi kao PDF</button>
        <button id="mailBtn" type="button">Posalji mailom</button>
    </div>

    <div id="board"></div>

    <div id="mailModal" class="modal">
        <div class="modal-content">
            <h3>Posalji mailom</h3>
            <input type="email" id="mailInput" placeholder="Unesite email adresu">
            <div class="modal-buttons">
                <button id="mailSend" type="button">Posalji</button>
                <button id="mailCancel" type="button">Ponisti</button>
            </div>
        </div>
    </div>

    <footer>IPI Akademija - Vision Board</footer>

    <script src="javascript.js"></script>
</body>
</html>
